<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaturnDEX Assets - Token Listing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .token-card:hover { transform: translateY(-2px); }
        .modal { transition: opacity 0.2s ease-in-out; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .logo-preview { width: 80px; height: 80px; object-fit: contain; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .social-icon { width: 20px; height: 20px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/Saturn-DEX/assets/main/saturn%203232.svg" alt="SaturnDEX" class="h-8">
                <h1 class="text-xl font-bold text-gray-800">Assets Listing</h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="githubConnect" onclick="handleGitHubAuth()" class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span id="authText">Connect GitHub</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Tabs -->
        <div class="flex gap-8 border-b mb-8">
            <button onclick="showTab('browse')" id="tabBrowse" class="pb-3 font-medium tab-active">Browse Tokens</button>
            <button onclick="showTab('submit')" id="tabSubmit" class="pb-3 font-medium text-gray-500 hover:text-gray-800">Submit New Token</button>
        </div>

        <!-- Browse Tab -->
        <div id="browseTab">
            <!-- Search and Filter -->
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="Search by name, symbol, or address..." 
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           oninput="filterTokens()">
                </div>
                <select id="chainFilter" onchange="filterTokens()" class="px-4 py-3 border rounded-lg">
                    <option value="all">All Chains</option>
                    <option value="ethereum">Ethereum</option>
                    <option value="classic">Ethereum Classic</option>
                </select>
            </div>

            <!-- Token Count -->
            <p id="tokenCount" class="text-gray-500 mb-4">Loading tokens...</p>

            <!-- Token Grid -->
            <div id="tokenGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Tokens will be loaded here -->
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="flex justify-center py-12">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Submit Tab -->
        <div id="submitTab" class="hidden">
            <div class="bg-white rounded-lg shadow p-6 max-w-2xl">
                <h2 class="text-xl font-bold mb-6">List Your Token</h2>
                <form id="tokenForm" onsubmit="submitToken(event)">
                    <!-- Chain Selection -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Chain *</label>
                        <select id="formChain" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="ethereum">Ethereum</option>
                            <option value="classic">Ethereum Classic</option>
                        </select>
                    </div>

                    <!-- Contract Address -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Contract Address *</label>
                        <input type="text" id="formAddress" required placeholder="0x..." 
                               class="w-full px-4 py-2 border rounded-lg font-mono"
                               oninput="validateAddress(this)">
                        <p id="addressError" class="text-red-500 text-sm mt-1 hidden"></p>
                    </div>

                    <!-- Token Name -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Token Name *</label>
                        <input type="text" id="formName" required placeholder="e.g., Saturn Token"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Symbol -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Symbol *</label>
                        <input type="text" id="formSymbol" required placeholder="e.g., SATURN"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Decimals -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Decimals *</label>
                        <input type="number" id="formDecimals" required min="0" max="18" placeholder="18"
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Logo Upload -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Logo (PNG, 200x200, transparent)</label>
                        <input type="file" id="formLogo" accept="image/png" onchange="previewLogo(this)"
                               class="w-full px-4 py-2 border rounded-lg">
                        <div id="logoPreview" class="mt-2 hidden">
                            <img id="logoPreviewImg" class="logo-preview border rounded">
                        </div>
                        <p id="logoError" class="text-red-500 text-sm mt-1 hidden"></p>
                    </div>

                    <!-- Social Links -->
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Social Links (optional)</h3>
                    
                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Website</label>
                        <input type="url" id="formWebsite" placeholder="https://..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Twitter/X</label>
                        <input type="url" id="formX" placeholder="https://x.com/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Telegram</label>
                        <input type="url" id="formTelegram" placeholder="https://t.me/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Discord</label>
                        <input type="url" id="formDiscord" placeholder="https://discord.gg/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Reddit</label>
                        <input type="url" id="formReddit" placeholder="https://reddit.com/r/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-500 mb-1">Facebook</label>
                        <input type="url" id="formFacebook" placeholder="https://facebook.com/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div class="mb-6">
                        <label class="block text-xs text-gray-500 mb-1">CoinGecko</label>
                        <input type="url" id="formCoingecko" placeholder="https://www.coingecko.com/en/coins/..."
                               class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        Submit for Review
                    </button>
                    <p class="text-xs text-gray-500 mt-2 text-center">You must be connected to GitHub to submit. A Pull Request will be created and validated automatically; the SaturnDEX team reviews before merge.</p>
                </form>
            </div>
        </div>
    </main>

    <!-- Token Detail Modal -->
    <div id="tokenModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden modal" onclick="closeModal(event)">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-lg w-full p-6" onclick="event.stopPropagation()">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modalTitle" class="text-xl font-bold"></h3>
                    <button onclick="closeTokenModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
                </div>
                <div class="flex items-center gap-4 mb-4">
                    <img id="modalLogo" class="w-16 h-16 rounded-full border">
                    <div>
                        <p id="modalSymbol" class="text-lg font-medium"></p>
                        <p id="modalAddress" class="text-sm text-gray-500 font-mono break-all"></p>
                        <p id="modalDecimals" class="text-sm text-gray-500"></p>
                    </div>
                </div>
                <div id="modalLinks" class="flex flex-wrap gap-2 mb-4">
                    <!-- Links will be added here -->
                </div>
                <div class="flex gap-2">
                    <button id="editTokenBtn" onclick="editToken()" class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200">Edit Token</button>
                    <button onclick="closeTokenModal()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
        <p id="toastMessage"></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
